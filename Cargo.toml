[package]
name = "davusic"
version = "0.1.1"
description = "Davusic — reproductor de música nativo, local-first, al estilo de davito.dev"
authors = ["Davo"]
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
name = "davusic_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "davusic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
lofty = "0.25"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif", "bmp"] }
dirs = "6"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", features = ["tokio"] }
async-std = { version = "1", features = ["attributes", "unstable"] }


[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
