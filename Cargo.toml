[package]
name = "davusic"
version = "0.1.0"
description = "Davusic — reproductor de música nativo, local-first, al estilo de davito.dev"
authors = ["Davo"]
edition = "2021"
rust-version = "1.95"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
lofty = "0.25"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif", "bmp"] }
rfd = "0.17"
dirs = "6"
parking_lot = "0.12"
mpris-server = { version = "0.10", features = ["tokio"] }
async-std = { version = "1", features = ["attributes", "unstable"] }
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
sha2 = "0.10"


[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
