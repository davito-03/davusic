name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rust + frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri/WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests de Rust
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sintaxis del frontend
        run: node --check frontend/app.js

      - name: Build release
        run: cargo build --release
